<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#703ee8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hedger" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hedger</title>
    <script>
      (() => {
        let mode = "light";
        try {
          const saved = JSON.parse(localStorage.getItem("hedger-preferences-v1") || "null");
          mode = saved && saved.themeMode === "dark" ? "dark" : "light";
        } catch (_) {}
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <style>
      :root { --ui-page-bg:#f6f7ff; --ui-surface:#fff; --ui-primary:#5b2ec4; --ui-primary-soft:#f1ecff; --ui-focus-ring:#7c3aed; --ui-card-shadow:0 1px 2px rgba(76,29,149,.04),0 10px 30px rgba(76,29,149,.07); }
      :root[data-theme="dark"] { --ui-page-bg:#0f172a; --ui-surface:#1e293b; --ui-primary:#60a5fa; --ui-primary-soft:#1e3a5f; --ui-focus-ring:#60a5fa; --ui-card-shadow:0 1px 2px rgba(0,0,0,.24),0 10px 28px rgba(0,0,0,.32); }
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
